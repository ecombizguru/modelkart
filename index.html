    <script>
      (function() {
        // Fix for extensions or iframe sandbox environments assigning to window.fetch
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = currentFetch;
          var fetchDescriptor = {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (_) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            }
          } catch (_) {}
        } catch (_) {}

        // Filter out third-party extension injection exceptions
        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
